name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Aucun secret n'est necessaire : la CI ne joint jamais l'API OpenSky.
  # Elle travaille sur un lac synthetique deterministe.
  SKYTRACE_DATA_DIR: ${{ github.workspace }}/data
  SKYTRACE_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/skytrace.duckdb
  SKYTRACE_REGION: france

jobs:
  quality:
    name: Lint et tests unitaires
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installation
        run: pip install -e ".[transform,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Tests unitaires
        run: pytest --cov=skytrace --cov-report=term-missing

  pipeline:
    name: Chaine de transformation et qualite des donnees
    runs-on: ubuntu-latest
    # La logique metier vit dans le SQL : une CI qui ne testerait que le
    # Python passerait a cote de l'essentiel. On execute donc la chaine dbt
    # complete et ses controles sur un jeu de donnees synthetique.
    steps:
      - uses: actions/checkout@v4
        with:
          # Deux commits : l'etape de migration construit avec les modeles du
          # precedent avant de lancer ceux d'aujourd'hui.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation
        run: pip install -e ".[transform,analysis]"

      - name: Generation du lac de donnees synthetique
        run: python scripts/generate_demo_data.py --hours 12 --per-hour 4 --aircraft 200

      - name: Verification de la coherence du projet dbt
        run: skytrace dbt parse

      - name: Construction et tests des modeles
        run: skytrace dbt build

      - name: Idempotence - une seconde execution ne doit rien casser
        # Verifie la strategie incrementale `delete+insert` : rejouer
        # l'ensemble ne doit ni dupliquer de lignes ni faire echouer le
        # test de grain unique.
        run: skytrace dbt build

      - name: Reconstruction complete
        run: skytrace dbt build --full-refresh

      - name: Migration - le code neuf sur un entrepot ancien
        # CE QUE CETTE ETAPE ATTRAPE, ET QUE LES DEUX PRECEDENTES LAISSENT
        # PASSER. Les etapes ci-dessus rejouent `dbt build` deux fois avec le
        # MEME code : c'est de l'idempotence, et c'est necessaire. Ce n'est
        # pas ce qui casse en production.
        #
        # Ce qui casse, c'est un entrepot bati avec les ANCIENS modeles puis
        # du dbt NEUF par-dessus - la sequence que vit tout deploiement. Une
        # colonne ajoutee a un modele incremental n'est pas retro-remplie :
        # `append_new_columns` l'ajoute a la table mais laisse l'historique a
        # NULL. Un test `not_null` echoue alors sur tout le passe, le build
        # s'arrete, et l'aval est ignore - dimensions comprises. C'est arrive.
        #
        # On rejoue donc la migration : on construit avec les modeles du
        # commit precedent, puis on lance ceux d'aujourd'hui sur le meme
        # entrepot. Aucun modele ignore n'est tolere.
        run: |
          set -euo pipefail

          precedent=$(git rev-parse HEAD~1 2>/dev/null || true)
          if [ -z "$precedent" ]; then
            echo "::notice::Pas de commit precedent : migration non testable."
            exit 0
          fi

          git worktree add --detach /tmp/precedent "$precedent"
          if [ ! -f /tmp/precedent/dbt/skytrace/dbt_project.yml ]; then
            echo "::notice::Projet dbt absent du commit precedent : etape ignoree."
            exit 0
          fi

          export SKYTRACE_DUCKDB_PATH="${GITHUB_WORKSPACE}/data/warehouse/migration.duckdb"
          rm -f "$SKYTRACE_DUCKDB_PATH"

          echo "--- entrepot bati avec les modeles de $precedent"
          skytrace dbt build --project-dir /tmp/precedent/dbt/skytrace \
                             --profiles-dir /tmp/precedent/dbt/skytrace

          echo "--- puis les modeles d'aujourd'hui, sur le meme entrepot"
          skytrace dbt build 2>&1 | tee /tmp/migration.log

          # `dbt build` sort en erreur si un test dur echoue, ce que `set -e`
          # attrape deja. Mais un modele IGNORE ne fait pas echouer la
          # commande : c'est precisement ce qui avait laisse les dimensions a
          # l'ancien schema sans que rien ne devienne rouge.
          if grep -qE 'SKIP=[1-9]' /tmp/migration.log; then
            echo "::error::Des modeles ont ete ignores apres migration : l'entrepot resterait en retard sur le code."
            exit 1
          fi

      - name: Inventaire de l'entrepot
        run: skytrace info

      - name: Analyse trafic / qualite de l'air
        # Verifie que le script d'analyse s'execute de bout en bout et
        # produit son rapport + sa figure (sur donnees synthetiques ici).
        run: python scripts/analyse_qualite_air.py

      - name: Publication de la documentation dbt
        run: skytrace dbt docs generate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-target
          path: dbt/skytrace/target/
          retention-days: 7

  orchestration:
    name: Validation des definitions Dagster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation
        run: pip install -e ".[transform,orchestration]"

      - name: Generation du lac de donnees synthetique
        run: python scripts/generate_demo_data.py --hours 2 --per-hour 2 --aircraft 50

      - name: Validation du graphe d'assets
        run: dagster definitions validate -m orchestration.definitions
