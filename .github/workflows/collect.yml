name: Collecte planifiee

# Ce workflow EST l'ordonnanceur de la version publique du projet.
#
# En local, c'est Dagster qui declenche la collecte. Dans le cloud, GitHub
# Actions joue ce role gratuitement : le cron reveille un runner, collecte un
# snapshot du trafic, l'ecrit sur Cloudflare R2 (stockage objet), et lance dbt
# comme garde-fou qualite. Les donnees ne transitent plus par git : le depot
# reste leger, et on peut passer a l'echelle (monde, haute frequence) sans le
# faire exploser.
#
# Cout : nul (minutes Actions illimitees sur depot public ; R2 gratuit jusqu'a
# 10 Go). Aucun secret OpenSky requis (mode anonyme).
#
# Secrets a definir dans le depot (Settings -> Secrets and variables -> Actions)
# une fois le bucket R2 cree :
#   SKYTRACE_R2_ACCOUNT_ID, SKYTRACE_R2_BUCKET,
#   SKYTRACE_R2_ACCESS_KEY_ID, SKYTRACE_R2_SECRET_ACCESS_KEY

on:
  schedule:
    # Une fois par heure, DECALE des heures rondes ou la contention est
    # maximale : GitHub execute les crons "au mieux" et tout le monde
    # planifie a la minute zero. Mesure faite sur ce depot, les ecarts reels
    # allaient de 52 a 226 min.
    #
    # POURQUOI UNE HEURE ET NON TRENTE MINUTES. Deux raisons, et la seconde
    # compte davantage.
    #
    # D'abord parce que demander plus ne donnait pas plus : a 48 demandes par
    # jour, GitHub n'en honorait qu'une quinzaine. L'ecart median mesure
    # etait de 80 min, soit plus du double de la cadence annoncee. Reclamer
    # une cadence que l'ordonnanceur ne tient pas ne collecte rien de plus,
    # cela rend seulement le decalage illisible.
    #
    # Ensuite parce qu'une heure EST la resolution de l'analyse. La
    # correlation trafic / NO2 est horaire, la meteo d'Open-Meteo est
    # horaire : un releve par heure est la cadence du sujet, pas un
    # compromis de repli.
    #
    # Les trous restants sont assumes et rendus visibles par le bandeau de
    # fraicheur du tableau de bord.
    - cron: "17 * * * *"
  workflow_dispatch: {} # declenchement manuel depuis l'onglet Actions

permissions:
  # Le jeton du workflow ne sert qu'a recuperer le code. Sans cette
  # declaration il herite du reglage du depot, qui peut permettre l'ecriture :
  # une dependance compromise pourrait alors pousser un commit.
  contents: read

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # Zone monde : couverture ADS-B mondiale (dense en Europe/Amerique du
      # Nord, plus clairsemee ailleurs). 4 credits/appel, 48/jour = 192/400.
      # Le stockage est borne par la retention (SKYTRACE_RETENTION_DAYS).
      SKYTRACE_REGION: world
      # Identifiants OpenSky, FACULTATIFS. Sans eux le client reste anonyme :
      # la collecte courante fonctionne, mais l'historique est refuse et le
      # budget quotidien est dix fois plus bas. Les definir active le
      # rattrapage des trous sans autre changement.
      OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
      OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      # Entrepot DuckDB local au runner (ephemere) : sert au garde-fou dbt.
      SKYTRACE_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/skytrace.duckdb
      # Lac brut sur R2 (identifiants en secrets).
      SKYTRACE_R2_ACCOUNT_ID: ${{ secrets.SKYTRACE_R2_ACCOUNT_ID }}
      SKYTRACE_R2_BUCKET: ${{ secrets.SKYTRACE_R2_BUCKET }}
      SKYTRACE_R2_ACCESS_KEY_ID: ${{ secrets.SKYTRACE_R2_ACCESS_KEY_ID }}
      SKYTRACE_R2_SECRET_ACCESS_KEY: ${{ secrets.SKYTRACE_R2_SECRET_ACCESS_KEY }}
      # Facultatif : sans lui, l'etape de battement est simplement sautee.
      HEARTBEAT_URL: ${{ secrets.SKYTRACE_HEARTBEAT_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Garde-fou - secrets R2 presents
        # En mode R2 le workflow ne committe plus les donnees dans git. Sans
        # les secrets, la collecte ecrirait sur le disque du runner puis serait
        # perdue. On echoue donc franchement plutot que de tourner dans le vide.
        run: |
          if [ -z "${SKYTRACE_R2_BUCKET}" ] || [ -z "${SKYTRACE_R2_ACCESS_KEY_ID}" ]; then
            echo "::error::Secrets R2 manquants. Definir SKYTRACE_R2_* dans les secrets du depot (voir docs/r2.md)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation
        run: pip install -e ".[transform]"

      - name: Verification de l'acces R2
        run: skytrace storage-check

      - name: Collecte et transformation
        # `pipeline` = ingestion d'un snapshot (ecrit sur R2) + referentiels si
        # absents + dbt build (lit R2). dbt build sert de garde-fou qualite :
        # si un test dur echoue sur la donnee fraiche, le workflow passe au
        # rouge - un signal honnete et visible.
        #
        # POURQUOI TROIS TENTATIVES. Ce workflow appelle deux services par le
        # reseau : OpenSky et R2. Un delai depasse, un 502 passager ou une
        # coupure de quelques secondes faisaient echouer la collecte et
        # envoyaient un courriel - pour une panne qui n'existait plus a la
        # minute suivante.
        #
        # Une alerte qui ne demande aucune action est pire qu'inutile : elle
        # apprend a ignorer les suivantes. On retente donc, espace, et on ne
        # signale que ce qui resiste aux trois essais. Le pipeline est
        # idempotent - la table de faits est incrementale en `delete+insert`
        # sur la cle (appareil, instant) - donc rejouer ne duplique rien.
        run: |
          for tentative in 1 2 3; do
            echo "::group::Tentative $tentative/3"
            if skytrace pipeline; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Tentative $tentative en echec."
            if [ "$tentative" -lt 3 ]; then
              sleep 60
            fi
          done
          echo "::error::Trois tentatives de collecte ont echoue."
          exit 1

      - name: Publication de l'etat du pipeline
        # Document JSON a la racine du lac, lisible sans identifiants si le
        # bucket expose une adresse publique. Publie APRES la collecte, et
        # seulement si elle a reussi : un etat publie apres un echec
        # annoncerait une fraicheur qui n'existe pas.
        run: skytrace publier-sante

      - name: Battement vers le moniteur externe
        # LE SEUL SIGNAL QUI DETECTE L'ARRET DES CRONS, et il fonctionne a
        # l'envers des autres.
        #
        # Les autres surveillances INTERROGENT le pipeline. Elles ne peuvent
        # donc rien dire quand ce qui les execute s'arrete : le 26 aout 2026,
        # GitHub a cesse d'executer les taches planifiees du compte et les
        # trois surveillances se sont tues avec la collecte. Le document de
        # sante ci-dessus a la meme faiblesse : c'est un fichier statique, il
        # se fige sur son dernier contenu et continue d'afficher "OK".
        #
        # Ici c'est le pipeline qui ANNONCE qu'il a tourne. L'absence
        # d'annonce est le signal, et une absence ne peut pas etre falsifiee
        # par un composant a l'arret. Le service tiers alerte quand le
        # battement n'arrive pas dans le delai imparti - que la cause soit
        # GitHub, R2, OpenSky ou le reseau.
        #
        # L'etape ne s'execute que si tout ce qui precede a reussi : un
        # battement envoye apres un echec dirait "tout va bien" alors que
        # rien n'a ete collecte.
        #
        # Sans le secret, l'etape ne fait rien : le depot reste clonable et
        # utilisable sans compte chez un tiers.
        if: ${{ env.HEARTBEAT_URL != '' }}
        run: curl --fail --silent --show-error --max-time 20 --retry 3 "$HEARTBEAT_URL"
