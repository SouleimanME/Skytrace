name: Veille de la collecte

# CE QUE CE WORKFLOW AJOUTE. GitHub previent deja par courriel quand un
# workflow ECHOUE. Il ne dit rien de trois pannes silencieuses, pourtant les
# plus probables sur ce montage :
#
#   * la collecte reussit mais n'ecrit rien - source muette, quota OpenSky
#     epuise, ecriture qui part dans le vide ;
#   * GitHub desactive les taches planifiees d'un depot public reste soixante
#     jours sans commit, et la collecte s'arrete sans un seul echec ;
#   * les identifiants R2 expirent.
#
# Dans ces trois cas tout reste vert et la donnee cesse d'arriver. La seule
# question qui les couvre est : quand le LAC a-t-il ete ecrit pour la
# derniere fois ? On interroge donc le lac, et non l'entrepot - un entrepot
# fraichement reconstruit a partir d'un lac fige donnerait l'illusion que
# tout va bien.
#
# L'alerte emprunte le canal qu'on regarde deja : une tache rouge dans
# l'onglet Actions et le courriel que GitHub envoie a la premiere execution
# en echec. Pas de service de plus, pas de compte de plus, pas de jeton de
# plus a faire tourner.
#
# LA LIMITE EST ASSUMEE. Si GitHub desactive les taches planifiees du depot,
# il desactive aussi celle-ci : la veille s'eteint avec ce qu'elle surveille.
# Elle couvre les pannes de la collecte, pas la disparition de
# l'ordonnanceur. Un commit de temps en temps suffit a garder les deux en vie.

on:
  schedule:
    # Deux fois par jour, decale des heures rondes ou la contention est
    # maximale (meme raison que pour la collecte).
    #
    # Une veille n'a pas besoin d'etre frequente, elle a besoin d'etre
    # fiable. Detecter en douze heures un arret de collecte est amplement
    # suffisant : le seuil d'alerte est lui-meme a dix heures.
    - cron: "41 5,17 * * *"
  workflow_dispatch: {}

permissions:
  # Le jeton du workflow ne sert qu'a recuperer le code. Sans cette
  # declaration il herite du reglage du depot, qui peut permettre l'ecriture :
  # une dependance compromise pourrait alors pousser un commit.
  contents: read

concurrency:
  # GROUPE `collecte` ET NON `veille`, DEPUIS QUE CETTE TACHE REPARE.
  #
  # Elle ne se contentait plus de lire : son etape de reparation lance une
  # collecte, donc elle ECRIT dans l'entrepot. Avec un groupe distinct, elle
  # pouvait le faire pendant que `collect.yml` ecrivait aussi - et DuckDB
  # n'autorise qu'un seul ecrivain. Le partage du groupe met les deux en file
  # au lieu de les laisser se marcher dessus.
  #
  # Le passage normal ne coute que quelques secondes : attendre une collecte
  # en cours ne retarde rien de perceptible.
  group: collecte
  cancel-in-progress: true

jobs:
  fraicheur:
    name: Fraicheur du lac
    runs-on: ubuntu-latest
    env:
      HEARTBEAT_URL: ${{ secrets.SKYTRACE_HEARTBEAT_URL }}
      # LA REPARATION DOIT COLLECTER LA MEME ZONE QUE LA COLLECTE.
      # Sans ces deux variables, la valeur par defaut s'applique - c'est
      # `france`, une fenetre dix fois plus etroite. Un rattrapage
      # deposerait alors un releve partiel indiscernable des autres, et
      # creuserait un trou artificiel dans toutes les series. L'erreur a
      # deja ete commise a la main : elle ne doit pas etre automatisee.
      SKYTRACE_REGION: world
      # Identifiants OpenSky, FACULTATIFS. Sans eux le client reste anonyme :
      # la collecte courante fonctionne, mais l'historique est refuse et le
      # budget quotidien est dix fois plus bas. Les definir active le
      # rattrapage des trous sans autre changement.
      OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
      OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      SKYTRACE_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/skytrace.duckdb
      SKYTRACE_R2_ACCOUNT_ID: ${{ secrets.SKYTRACE_R2_ACCOUNT_ID }}
      SKYTRACE_R2_BUCKET: ${{ secrets.SKYTRACE_R2_BUCKET }}
      SKYTRACE_R2_ACCESS_KEY_ID: ${{ secrets.SKYTRACE_R2_ACCESS_KEY_ID }}
      SKYTRACE_R2_SECRET_ACCESS_KEY: ${{ secrets.SKYTRACE_R2_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Secrets R2 presents ?
        id: garde
        # Un depot forke n'a pas ces secrets : la veille ne doit pas y sonner
        # une alarme faute de configuration.
        run: |
          if [ -z "${SKYTRACE_R2_BUCKET}" ]; then
            echo "::notice::Secrets R2 absents : veille inactive."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.garde.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation
        if: steps.garde.outputs.active == 'true'
        # La chaine de transformation est necessaire : cette tache ne se
        # contente plus de constater, elle repare.
        run: pip install -e ".[transform]"

      - name: Age du dernier releve
        id: fraicheur
        if: steps.garde.outputs.active == 'true'
        # Dix heures : les ecarts mesures entre deux collectes vont de la
        # minute a plus de trois heures, le cron GitHub n'etant pas ponctuel.
        # Un seuil serre alerterait en permanence, donc n'alerterait plus.
        #
        # `continue-on-error` n'est PAS une facon d'ignorer l'echec : c'est ce
        # qui permet a l'etape suivante de le rattraper. Sans lui, la tache
        # s'arreterait ici et se contenterait de prevenir.
        continue-on-error: true
        run: skytrace watchdog --max-age-hours 10

      - name: Reparation - collecter puisque personne ne l'a fait
        if: steps.garde.outputs.active == 'true' && steps.fraicheur.outcome == 'failure'
        # CE QUE CETTE ETAPE CHANGE, ET POURQUOI ELLE EXISTE.
        #
        # Cette tache constatait l'arret de la collecte et faisait passer le
        # workflow au rouge. Un courriel partait, et il fallait aller cliquer.
        # Une surveillance qui exige une intervention humaine pour une panne
        # dont la reparation tient en une commande n'est pas de
        # l'automatisation : c'est un rappel de corvee.
        #
        # Elle collecte donc elle-meme. La panne la plus frequente - le cron
        # de collecte n'a pas ete declenche - se repare sans que personne ne
        # soit prevenu, ce qui est le comportement attendu d'un systeme
        # automatise.
        #
        # Le workflow ne passe au rouge QUE si cette reparation echoue aussi.
        # A ce moment-la seulement, le courriel est merite : il signale
        # quelque chose que le systeme ne sait pas resoudre seul.
        run: |
          echo "Lac perime : collecte de rattrapage."
          skytrace pipeline
          skytrace publier-sante

      - name: Rattrapage des trous de la serie
        if: steps.garde.outputs.active == 'true'
        # SANS IDENTIFIANTS OPENSKY, CETTE ETAPE NE FAIT RIEN ET SORT EN 0.
        #
        # Mesure sur ce depot : 102 heures perdues sur environ 250, dont un
        # trou de 35 heures pendant que l'ordonnanceur GitHub se taisait. Ces
        # positions ne revenaient jamais - la collecte reprend au present et la
        # serie garde son vide pour toujours. Une serie temporelle trouee ne se
        # compare pas a elle-meme d'une periode a l'autre.
        #
        # Le rattrapage exige un compte OpenSky : l'API refuse l'historique aux
        # requetes anonymes. La commande s'en apercoit et s'abstient plutot que
        # d'echouer, parce qu'une alerte pour une capacite non configuree ne
        # demande aucune action.
        #
        # Le plafond de 12 releves par passage borne la depense en credits :
        # les trous se comblent par tranches, deux fois par jour.
        run: skytrace backfill --max-snapshots 12

      - name: Battement de coeur apres reparation
        if: >-
          steps.garde.outputs.active == 'true'
          && steps.fraicheur.outcome == 'failure'
          && env.HEARTBEAT_URL != ''
        # La reparation a produit une collecte : le battement doit partir,
        # sinon le moniteur externe alerterait pour une panne deja resolue.
        run: curl --fail --silent --show-error --max-time 20 --retry 3 "$HEARTBEAT_URL"
