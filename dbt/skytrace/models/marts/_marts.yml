version: 2

models:
  # ---------------------------------------------------------------------
  # Faits
  # ---------------------------------------------------------------------
  - name: fct_aircraft_positions
    description: >
      Table de faits centrale. Grain : un aeronef observe a un instant
      donne. Materialisation incrementale, idempotente par rejeu.
    columns:
      - name: aircraft_icao24
        description: Cle etrangere vers dim_aircraft.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_aircraft')
                field: aircraft_icao24
      - name: snapshot_at
        data_tests:
          - not_null
      - name: flight_phase
        description: Phase de vol deduite du taux de montee.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["sol", "montee", "descente", "croisiere", "inconnu"]
      - name: barometric_altitude_ft
        data_tests:
          # Plausibilite de capteur -> warn (voir stg_opensky__states).
          - accepted_range:
              arguments:
                min_value: -1650
                max_value: 66000
              config:
                severity: warn
      - name: ground_speed_kt
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 780
              config:
                severity: warn
      - name: position_age_seconds
        description: >
          Age de la derniere position connue au moment du releve. Une
          valeur negative signalerait une incoherence d'horloge cote source.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: is_position_stale
        description: >
          Position vieille de plus de 300 s, soit au-dela du 99e centile
          mesure. OpenSky conserve le dernier point connu d'un appareil sorti
          de couverture : ces positions existent, mais les dessiner sur une
          carte du trafic courant serait faux.
        data_tests:
          - not_null
      - name: emergency_kind
        description: >
          Code de detresse OACI, traduit. Nul dans l'immense majorite des cas.
          A lire comme un signal a verifier et non comme un fait etabli : un
          7500 resulte presque toujours d'une erreur de selection.
        data_tests:
          - accepted_values:
              arguments:
                values: ["detournement", "panne radio", "urgence generale"]

  - name: fct_traffic_hourly
    description: >
      Trafic agrege par heure et par pays d'immatriculation. Sert de socle
      aux series temporelles du tableau de bord.
    columns:
      - name: traffic_hour
        data_tests:
          - not_null
      - name: origin_country
        data_tests:
          - not_null
      - name: distinct_aircraft
        description: >
          Mesure NON additive dans le temps : ne pas sommer plusieurs
          heures pour obtenir un total journalier.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
      - name: position_count
        description: Mesure additive, utilisable pour toute agregation.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1

  - name: fct_airport_activity
    description: >
      Activite observee autour de chaque aeroport, par heure. Les phases
      (montee / descente) sont des inferences, pas des mouvements declares.
    columns:
      - name: airport_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_id
      - name: activity_hour
        data_tests:
          - not_null
      - name: distinct_aircraft
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
      - name: avg_distance_km
        description: Distance moyenne au point de reference de l'aeroport.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                # doit rester sous var('airport_activity_radius_km')
                max_value: 8

  # ---------------------------------------------------------------------
  # Dimensions
  # ---------------------------------------------------------------------
  - name: dim_aircraft
    description: >
      Dimension aeronef, construite par agregation des observations.
    columns:
      - name: aircraft_icao24
        data_tests:
          - not_null
          - unique
      - name: observation_count
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
      - name: on_ground_ratio
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: first_seen_at
        data_tests:
          - not_null
      - name: last_seen_at
        data_tests:
          - not_null
      - name: airline_source
        description: >
          Origine du rattachement a une compagnie : "code exploitant" quand la
          base aeronefs le declare, "indicatif" quand il est deduit du prefixe
          d'indicatif, nul quand aucune des deux cles ne designe une compagnie
          connue. Permet de ponderer la confiance d'un classement.
        data_tests:
          - accepted_values:
              arguments:
                values: ["code exploitant", "indicatif"]
      - name: airline_icao
        description: >
          Code OACI de l'exploitant. Un rattachement sans nom de compagnie
          reste possible : le code peut etre atteste sans figurer dans
          OpenFlights.
      - name: airline_name
        description: >
          Nom canonique OpenFlights, sauf lorsque celui-ci est declare perime
          et contredit par l'exploitant nomme dans la base aeronefs.

  - name: fct_aircraft_predictions
    description: >
      Sorties du classifieur d'appareils, a COTE de la donnee declaree et
      jamais a sa place. Une valeur predite qui remplacerait une valeur
      observee deviendrait indiscernable d'un fait au bout de quelques
      semaines. La table porte donc les deux, ce qui permet aussi de
      surveiller la derive du modele sans etiquette fraiche.
    columns:
      - name: aircraft_icao24
        data_tests:
          - not_null
          - unique
      - name: predicted_commercial
        description: 1 si le comportement de vol est celui d'un transport commercial.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: probability_commercial
        description: Probabilite associee.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: model_trained_at
        description: Version du modele ayant produit la ligne.
        data_tests:
          - not_null
      - name: agrees_with_declared
        description: >
          Le modele confirme-t-il la donnee declaree ? Nul quand la base ne
          declare rien - c'est-a-dire dans le cas que le modele comble.
      - name: training_commercial_share
        description: >
          Part commerciale du jeu d'entrainement, recopiee sur chaque ligne.
          C'est la reference de derive : le tableau de bord n'a pas acces au
          fichier du modele, son conteneur etant neuf a chaque reveil. La
          colonne doit donc voyager avec les predictions.
        data_tests:
          - not_null
      - name: model_score
        description: Exactitude equilibree mesuree sur le jeu de test, a l'entrainement.
      - name: observations
        description: Nombre de releves ayant servi a decrire l'appareil.
        data_tests:
          - not_null
      - name: score_for_this_aircraft
        description: >
          Exactitude equilibree mesuree sur les appareils vus autant de fois
          que celui-ci. Le classifieur accepte un appareil apercu une seule
          fois : lui appliquer le score global lui promettrait une fiabilite
          qu'il n'a pas. Cette colonne existe pour que la nuance survive a la
          lecture.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: scored_at
        description: Date du scoring, distincte de celle de l'entrainement.

  - name: dim_airport
    description: >
      Dimension conforme des aerodromes, partagee par tous les faits
      geographiques.
    columns:
      - name: airport_id
        data_tests:
          - not_null
          - unique
      - name: airport_label
        data_tests:
          - not_null
      - name: grid_cell
        description: Cellule de grille de 1 degre, cle de pre-filtrage spatial.
        data_tests:
          - not_null
      - name: latitude
        data_tests:
          - accepted_range:
              arguments:
                min_value: -90
                max_value: 90
      - name: longitude
        data_tests:
          - accepted_range:
              arguments:
                min_value: -180
                max_value: 180

  - name: fct_airport_hourly_air_quality
    description: >
      Panel horaire trafic x qualite de l'air (aeroport, heure). Support de
      l'analyse trafic / pollution. Jointure interne : uniquement les
      aeroports suivis en qualite de l'air.
    columns:
      - name: airport_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_id
      - name: activity_hour
        data_tests:
          - not_null
      - name: hour_of_day
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 23
      - name: distinct_aircraft
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1

  - name: dim_airline
    description: >
      Dimension compagnie (OpenFlights). Grain : un code OACI de compagnie.
    columns:
      - name: airline_icao
        data_tests:
          - not_null
          - unique
      - name: airline_name
        data_tests:
          - not_null

  - name: fct_airline_airport_activity
    description: >
      Activite par compagnie et par aeroport (part de marche des compagnies).
      Le rattachement provient de dim_aircraft, qui porte la regle metier ;
      il n'est pas rededuit ici. airline_icao et airline_name sont nuls quand
      aucune cle ne designe une compagnie connue - aviation d'affaires,
      militaire, indicatifs non standard. Ces lignes sont CONSERVEES : elles
      representent du trafic reel, et les exclure gonflerait les parts de
      marche des compagnies identifiees.
    columns:
      - name: airport_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_id
      - name: airline_source
        description: Origine du rattachement, reprise de dim_aircraft.
        data_tests:
          - accepted_values:
              arguments:
                values: ["code exploitant", "indicatif"]
      - name: distinct_aircraft
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
