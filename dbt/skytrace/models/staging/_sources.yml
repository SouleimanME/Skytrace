version: 2

sources:
  - name: raw
    description: >
      Couche bronze : fichiers Parquet ecrits par la couche d'ingestion
      Python, lus directement par DuckDB sans etape de chargement. La
      donnee y est conservee telle que renvoyee par la source.
    schema: main

    tables:
      - name: opensky_states
        description: >
          Positions instantanees des aeronefs. Un fichier par appel API,
          partitionne par date et heure d'ingestion.
        # `loaded_at_field` alimente `dbt source freshness` : le pipeline
        # sait detecter tout seul que l'ingestion s'est arretee.
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 2, period: hour }
          error_after: { count: 12, period: hour }
        meta:
          external_location: >-
            read_parquet(
              '{{ env_var("SKYTRACE_LAKE_URI") }}/opensky_states/**/*.parquet',
              hive_partitioning = true,
              union_by_name = true
            )
        columns:
          - name: icao24
            description: Adresse OACI 24 bits du transpondeur - identifiant unique de l'appareil.
          - name: snapshot_ts
            description: Horodatage Unix du snapshot, commun a toutes les lignes du fichier.
          - name: ingested_at
            description: Horodatage d'ecriture cote pipeline (tracabilite).

      - name: ourairports_airports
        description: >
          Referentiel mondial des aerodromes (OurAirports), dimension a
          evolution lente rafraichie une fois par jour.
        meta:
          external_location: >-
            read_parquet('{{ env_var("SKYTRACE_LAKE_URI") }}/ourairports/airports.parquet')
        columns:
          - name: ident
            description: Code identifiant de l'aerodrome (souvent OACI).
          - name: type
            description: Categorie (large_airport, medium_airport, heliport...).

      - name: open_meteo_air_quality
        description: >
          Qualite de l'air horaire (NO2, PM2.5, PM10, ozone) mesuree aux
          coordonnees des grands aeroports suivis (Open-Meteo). Deuxieme
          source, support de l'analyse trafic / pollution.
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 36, period: hour }
          error_after: { count: 96, period: hour }
        meta:
          external_location: >-
            read_parquet('{{ env_var("SKYTRACE_LAKE_URI") }}/open_meteo_air_quality/air_quality.parquet')
        columns:
          - name: airport_icao
            description: Code OACI de l'aeroport - cle de jointure avec dim_airport.
          - name: measured_at
            description: Heure de la mesure (UTC).

      - name: model_predictions
        description: >
          Sorties du classifieur d'appareils (skytrace model score). Une ligne
          par aeronef assez observe, avec sa classe predite, la probabilite
          associee et la version du modele qui l'a produite.

          POURQUOI C'EST UNE SOURCE ET NON UN MODELE dbt. Le score est produit
          par du Python, pas par du SQL : dbt ne peut pas le calculer. Il
          transite donc par le lac comme n'importe quelle donnee externe, ce
          qui lui donne au passage la durabilite qui lui manquerait dans
          l'entrepot - celui-ci est reconstruit a intervalle regulier sur le
          deploiement public.
        meta:
          external_location: >-
            read_parquet('{{ env_var("SKYTRACE_LAKE_URI") }}/model_predictions/aircraft_class.parquet')
        columns:
          - name: aircraft_icao24
            description: Adresse OACI 24 bits - cle de jointure avec dim_aircraft.
          - name: predicted_commercial
            description: 1 si le comportement de vol est celui d'un transport commercial.
          - name: probability_commercial
            description: Probabilite associee, entre 0 et 1.
          - name: model_trained_at
            description: >
              Date d'entrainement du modele ayant produit la ligne. Sans elle,
              impossible d'imputer une derive au bon modele.

      - name: opensky_aircraft_db
        description: >
          Base aeronefs OpenSky (~500 000 appareils) : type, constructeur,
          modele, operateur par adresse OACI 24 bits. Troisieme source,
          enrichit dim_aircraft. Dimension a evolution lente (mensuelle).
        meta:
          external_location: >-
            read_parquet('{{ env_var("SKYTRACE_LAKE_URI") }}/opensky_aircraft_db/aircraft_database.parquet')
        columns:
          - name: icao24
            description: Adresse OACI 24 bits - cle de jointure avec les positions.
          - name: typecode
            description: Code type d'aeronef (A320, B738...).

      - name: openflights_airlines
        description: >
          Referentiel compagnies OpenFlights : code OACI (prefixe d'indicatif)
          -> nom et pays de la compagnie. Reference statique.
        meta:
          external_location: >-
            read_parquet('{{ env_var("SKYTRACE_LAKE_URI") }}/openflights_airlines/airlines.parquet')
        columns:
          - name: icao
            description: Code OACI de la compagnie (3 lettres), prefixe des indicatifs.
