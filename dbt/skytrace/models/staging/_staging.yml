version: 2

models:
  - name: stg_opensky__states
    description: >
      Positions d'aeronefs nettoyees et typees, correspondance 1 pour 1
      avec la couche bronze moins les lignes sans position exploitable.
    columns:
      - name: ingestion_region
        description: >
          Zone geographique demandee lors de la collecte (`world`, `europe`,
          `france`). La fenetre interrogee, non la position de l'appareil.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: aircraft_icao24
        description: Adresse OACI 24 bits, en minuscules. Identifiant de l'appareil.
        data_tests:
          - not_null
      - name: snapshot_at
        description: Instant du releve, commun a toutes les lignes d'un meme fichier source.
        data_tests:
          - not_null
      - name: latitude
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -90
                max_value: 90
      - name: longitude
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -180
                max_value: 180
      - name: barometric_altitude_m
        description: >
          Altitude barometrique. Peut etre legerement negative (aeroports
          sous le niveau de la mer, calage altimetrique) - l'intervalle
          tolere -500 m et plafonne au-dessus du plafond operationnel de
          l'aviation civile.
        data_tests:
          # Plausibilite de capteur, pas invariant structurel : le flux ADS-B
          # contient un bruit occasionnel (transpondeur defaillant). On
          # signale sans bloquer le pipeline (severity: warn) - halter une
          # collecte pour 2 releves aberrants sur des dizaines de milliers
          # serait disproportionne. Les invariants durs restent en error.
          - accepted_range:
              arguments:
                min_value: -500
                max_value: 20000
              config:
                severity: warn
      - name: ground_speed_ms
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 400
              config:
                severity: warn
      - name: heading_deg
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 360
      - name: is_on_ground
        data_tests:
          - not_null

  - name: stg_ourairports__airports
    description: >
      Referentiel aeroports restreint aux pistes grandes et moyennes.
    columns:
      - name: airport_id
        data_tests:
          - not_null
          - unique
      - name: airport_ident
        data_tests:
          - not_null
      - name: airport_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["large_airport", "medium_airport", "small_airport"]
      - name: latitude
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -90
                max_value: 90
      - name: longitude
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -180
                max_value: 180

  - name: stg_open_meteo__air_quality
    description: >
      Qualite de l'air horaire par aeroport, typee. Cle : (airport_icao,
      measured_hour).
    columns:
      - name: airport_icao
        data_tests:
          - not_null
      - name: measured_hour
        data_tests:
          - not_null
      - name: no2_ugm3
        description: Concentration de NO2 en microgrammes/m3.
        data_tests:
          # Plausibilite de mesure -> warn (voir philosophie stg_opensky).
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1000
              config:
                severity: warn
      - name: pm25_ugm3
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1000
              config:
                severity: warn

  - name: stg_opensky__aircraft
    description: >
      Base aeronefs OpenSky typee et dedupliquee (une ligne par appareil).
    columns:
      - name: aircraft_icao24
        data_tests:
          - not_null
          - unique
      - name: aircraft_type
        description: Code type d'aeronef (A320, B738...).

  - name: stg_openflights__airlines
    description: >
      Referentiel compagnies OpenFlights, une ligne par code OACI (3 lettres).
    columns:
      - name: airline_icao
        data_tests:
          - not_null
          - unique
      - name: airline_name
        data_tests:
          - not_null
