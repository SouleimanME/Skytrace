[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skytrace"
version = "0.1.0"
description = "Pipeline de donnees end-to-end sur le trafic aerien (OpenSky Network)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
transform = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]
orchestration = [
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "dagster-dbt>=0.23",
]
dashboard = [
    "streamlit>=1.49",
    "plotly>=5.22",
    "pydeck>=0.9",
]
analysis = [
    "matplotlib>=3.8",
]
# Extra separe : le modele n'est pas necessaire pour faire tourner le
# pipeline ni le tableau de bord, et scikit-learn pese lourd dans un runner.
ml = [
    "scikit-learn>=1.5",
    "joblib>=1.4",
]
dev = [
    # Le modele fait partie du projet : ses tests doivent tourner partout,
    # y compris en CI. L'extra `ml` reste separe pour l'EXECUTION - ni le
    # collecteur ni le tableau de bord n'ont besoin de scikit-learn, et
    # l'installer a chaque reveil couterait du temps pour rien.
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
skytrace = "skytrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
