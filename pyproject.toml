[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skytrace"
version = "0.1.0"
description = "Pipeline de donnees end-to-end sur le trafic aerien (OpenSky Network)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
transform = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]
orchestration = [
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "dagster-dbt>=0.23",
]
dashboard = [
    "streamlit>=1.36",
    "plotly>=5.22",
    "pydeck>=0.9",
]
analysis = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
skytrace = "skytrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
